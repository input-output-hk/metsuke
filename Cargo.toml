[workspace]
resolver = "2"
# Wildcard, not a list: the flake builds each binary from a source tree
# containing only its own crates, and cargo rejects a member it cannot find.
members = ["crates/*"]

[workspace.metadata.crane]
name = "metsuke-workspace"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/input-output-hk/metsuke"
