[advisories]
version = 2

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # webpki-roots, the Mozilla root store ureq bundles.
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Unpublished workspace crates reference each other by path alone; a version
# requirement there would re-couple the independently versioned crates (ADR 0006).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
