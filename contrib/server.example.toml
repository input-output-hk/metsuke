# metsuke-server configuration. Copy to /etc/metsuke-server/config.toml and
# set every value. Anything a field name does not already say is on that field
# in crates/metsuke-server/src/config.rs; this file is loaded by a test
# (crates/metsuke-server/tests/config.rs), so what it shows parses.

listen = "127.0.0.1:8080"

# Generous, because a pool on a bad link still has to get its batch in.
[http]
idle_timeout_ms = 30000
read_timeout_ms = 60000
write_timeout_ms = 60000
max_concurrent_requests = 64

# The S3 archive reads its credentials from AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY in the process environment.
[archive.s3]
bucket = "cardano-playground-metsuke"
region = "eu-central-1"
# Whatever stands in for S3 here has to answer a GET with a Content-Length,
# not chunked.
endpoint = "https://s3.eu-central-1.amazonaws.com"
request_timeout_ms = 30000
signature_validity_secs = 300
put_retries = 1
put_retry_backoff_ms = 500
list_max_pages = 1000

# The other kind, for a single-host deployment.
# [archive.filesystem]
# root = "/var/lib/metsuke-server/archive"

[ingest]
# Change this: the pools you onboarded against the application code each came
# in on, as the offline allowlist generator emits them.
allowlist = { pool1CHANGEME = "MUSA-0000" }
max_body_bytes = 1048576
max_header_bytes = 4096
# A runaway-agent backstop, not abuse control: ~16x headroom over six agents
# uploading once an hour.
rate_limit_uploads = 100
# And the same for every pool together, so one leaked key cannot bill the
# bucket for the whole allowlist's worth.
rate_limit_uploads_total = 2000
rate_limit_window_secs = 3600

# The account developers pull the archive back out as.
[developer]
user = "metsuke-dev"
password_file = "/run/credentials/metsuke-server.service/developerpassword"
# One listing is one bucket request, so anything above 1000 is clamped to it.
list_max_rows = 1000
