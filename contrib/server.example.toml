# metsuke-server configuration. Copy to /etc/metsuke-server/config.toml and
# set every value. Anything a field name does not already say is on that field
# in crates/metsuke-server/src/config.rs; this file is loaded by a test
# (crates/metsuke-server/tests/config.rs), so what it shows parses.

listen = "127.0.0.1:8080"

# Where operators reach this server. The onboarding page hands out agent
# configs pointing at it, so getting this wrong sends every pool's submissions
# somewhere else.
public_url = "https://metsuke.example.org"

# Optional. Static builds this server offers for download, keyed by the name
# each is served and linked under, so an operator needs no nix to get one. The
# onboarding page's install step offers a download when the x86_64 agent build
# is among them, and tells them to build it otherwise; name the aarch64 one too
# or an operator following the ARM note beside it has nothing to fetch. Anything
# else here is served but not linked from that page, which is how a tool for a
# different audience is handed out without putting it in front of a pool.
#
# Every build records the commit it came from. A build taken from whatever this
# server was built from is therefore a different file after any commit to the
# repository, including a fix that never touches the agent. One taken from a
# release is that release's own file.
#
# Each is fetched from its own release, the agent builds from the
# client-vX.Y.Z whose version this server was built against and the fetch
# builds from a fetch-vX.Y.Z:
#
#   tag=client-v1.0.0
#   base=https://github.com/input-output-hk/metsuke/releases/download/$tag
#   curl -fLO $base/metsuke-static-x86_64-linux
#   curl -fLO $base/metsuke-static-x86_64-linux.sha256
#   sha256sum -c metsuke-static-x86_64-linux.sha256
#   sudo mkdir -p /usr/local/lib/metsuke
#   sudo install -m 0644 metsuke-static-x86_64-linux /usr/local/lib/metsuke/
#
# The other names below go the same way. A nix deployment pins a metsuke input
# at each tag instead, which docs/deploying.md has.
# [downloads]
# metsuke-static-x86_64-linux = "/usr/local/lib/metsuke/metsuke-static-x86_64-linux"
# metsuke-static-aarch64-linux = "/usr/local/lib/metsuke/metsuke-static-aarch64-linux"
# metsuke-fetch-static-x86_64-linux = "/usr/local/lib/metsuke/metsuke-fetch-static-x86_64-linux"

# Generous, because a pool on a bad link still has to get its submission in.
[http]
idle_timeout_ms = 30000
read_timeout_ms = 60000
write_timeout_ms = 60000
max_concurrent_requests = 64

# The S3 archive reads its credentials from AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY in the process environment.
[archive.s3]
bucket = "metsuke-archive-example"
region = "eu-central-1"
# Whatever stands in for S3 here has to answer a GET with a Content-Length,
# not chunked.
endpoint = "https://s3.eu-central-1.amazonaws.com"
request_timeout_ms = 30000
signature_validity_secs = 300
put_retries = 1
put_retry_backoff_ms = 500
list_max_pages = 1000

# The other kind, for a single-host deployment.
# [archive.filesystem]
# root = "/var/lib/metsuke-server/archive"

[ingest]
# Change this: the pools you onboarded against the application code each came
# in on, as the offline allowlist generator emits them.
allowlist = { pool1CHANGEME = "MUSA-0000" }
# At least the agents' upload_batch_max_bytes, which is what they seal before
# compression, and which this counts after it. Set it under theirs and a
# submission that compresses poorly earns a 413, which an agent reads as
# terminal and reseals identically, so the same body is refused until its spool
# cap drops those rows. Compression is the only margin between the two numbers
# and nothing enforces it, so the margin belongs here.
max_body_bytes = 4194304
max_header_bytes = 4096
# How far either way a submission may be sealed from this server's clock. One is
# sealed at upload rather than when its scrapes were taken, so a spooled hour
# still arrives fresh; what this refuses is a captured submission sent again,
# and an agent whose host clock has drifted this far.
max_timestamp_skew_secs = 300
# A runaway-agent backstop, not abuse control: ~16x headroom over six agents
# uploading once an hour.
rate_limit_uploads = 100
# And the same for every pool together, so one leaked key cannot bill the
# bucket for the whole allowlist's worth.
rate_limit_uploads_total = 2000
rate_limit_window_secs = 3600

# The accounts developers pull the archive back out as. The file holds one
# `user = "password"` line each, so who has access is the secret's to say and
# revoking one person is an edit to one line. A username is letters, digits, '-'
# and '_', matched exactly.
[developer]
password_file = "/run/credentials/metsuke-server.service/developer-password"
# One listing is one bucket request, so anything above 1000 is clamped to it.
list_max_rows = 1000
