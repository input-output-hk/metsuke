# metsuke agent, metrics and trace lines off the node's stdout. Copy to
# /etc/metsuke/config.toml, set your pool id, check the three lines under it,
# and start the pair with contrib/node-pipe.conf.
#
# This source reads no journal and adds no group, which is not the same as
# holding none: under contrib/node-pipe.conf the agent runs as a process of
# your node's unit, so it keeps that unit's user, sandbox and groups, and the
# node's own processes can read the signing key that drop-in loads. Sign with
# a Leios key here rather than a cold key. That drop-in's own header covers
# both costs in full.
#
# Your node has to emit the trace namespaces first; the server's details page
# has that snippet.
#
# Everything else takes its shipped default, including which namespaces are
# selected. contrib/config.example.toml documents all of them.

# Your pool id, bech32.
pool_id = "pool1CHANGEME"

# Your node's PrometheusSimple endpoint, which has to be a loopback address.
metrics_url = "http://127.0.0.1:12798/metrics"

# The server you report to.
upload_url = "https://metsuke.example.org/v1/submit"

# What each line says it came from, so a pool reporting from more than one host
# can tell them apart. Left unset, it is this host's hostname, folded to
# lowercase.
# agent_id = "edge-1"

# Where the spool goes. This is the state directory contrib/node-pipe.conf
# creates, so leave it alone under systemd or in a container. If you run the
# pair from a shell, set a path you can write; /var/lib/metsuke already being
# there is not proof you can, because a previous run under a unit of its own
# leaves it a symlink only root can follow.
spool_path = "/var/lib/metsuke/spool.sqlite"

[log]
source = "pipe"
