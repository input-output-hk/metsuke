# Example drop-in for the node's unit, which is where the pipe
# setup lives. Generated: edit nix/unit.nix, then
# `nix build .#metsuke-pipe-dropin` and commit what it wrote here.
#
# Copy to
# /etc/systemd/system/<your-node>.service.d/zzzz-metsuke.conf. The
# name sorts last on purpose: drop-ins apply in lexicographic order
# across every directory they sit in, and an image shipping a
# host-wide service.d drop-in that resets LoadCredential= would
# otherwise clear the credential below.
#
# That directory is yours to make: `sudo mkdir -p` it. And bring:
#   the binary at /usr/local/bin/metsuke
#   the configuration at /etc/metsuke/config.toml
#   the signing key at /etc/metsuke/signing-key, owned by root, mode 0400
#
# Take contrib/config.pipe.toml as the configuration.
#
# Replace YOUR-NODE-COMMAND below with the command your node's unit
# already runs, which `systemctl cat <your-node>.service` prints.
# The empty ExecStart= is what clears that command before this one
# replaces it, and the shell is because systemd has no pipelines.
#
# The agent then runs as whatever user the node runs as, adds no
# group and reads no journal, and writes its spool under the state
# directory below. It passes every line through to its own stdout,
# so the node's output still reaches the journal. ADR 0010 has what
# each source costs.
#
# Two costs this setup has and the journald one does not. The agent
# is a process of the node's unit, so it runs under that unit's
# user, sandbox and groups rather than the ones metsuke.service
# sets for it. And LoadCredential= below is the node unit's, so
# $CREDENTIALS_DIRECTORY/signing-key is readable by every process
# that unit runs, cardano-node included. Use a Leios key here: a
# cold key cannot be replaced, because the pool id is its hash, so
# a compromised one ends that pool rather than rotating.
#
# LoadCredential= and StateDirectory= below add to the node's own
# rather than replacing them, because systemd appends to both
# lists. One consequence: a node unit that reads $STATE_DIRECTORY
# will see two colon separated paths once this is in place.
#
# Restart=always because a pipeline's exit status is the last
# command's, and this one ends with the agent, which exits 0 when
# the node's output ends. However the node dies, systemd would see
# a clean exit, so a node unit's own Restart=on-failure never fires
# and the pool leaves the network until somebody notices.
#
# `set -o pipefail` would answer it more precisely, by making the
# node's own status the pipeline's and so leaving the node unit's
# restart policy meaning what it says. It is not used because this
# runs under whatever /bin/sh the host has: dash gained pipefail in
# 0.5.12, so Debian 12 and Ubuntu 24.04 have it and Ubuntu 22.04,
# supported into 2027, does not. An unknown `set -o` ends a
# non-interactive shell, so there the node would not start at all,
# which is worse than the restart policy being wider than the
# operator chose.

[Service]
Restart=always
LoadCredential=signing-key:/etc/metsuke/signing-key
StateDirectory=metsuke
ExecStart=
ExecStart=/bin/sh -c 'YOUR-NODE-COMMAND | /usr/local/bin/metsuke --config /etc/metsuke/config.toml --signing-key %d/signing-key'
