[package]
name = "metsuke-server"
description = "Ingest server verifying and storing signed telemetry submissions"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
toml = "0.9.8"

[dependencies]
metsuke-wire = { path = "../metsuke-wire" }
# The applications arrive as a spreadsheet export, so a column the gate ignores
# may be quoted; RFC 4180 is not worth hand-rolling for a file that decides who
# is allowlisted.
csv = "1.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Request signing and listing only; the transport is ureq.
rusty-s3 = { version = "0.10.2", default-features = false, features = [
  "rustcrypto",
  "xml",
] }
# The db-sync client, and the one thing here that drives a tokio runtime: ADR 0009.
postgres = "0.19.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
tiny_http = { version = "0.12.0", default-features = false }
toml = "0.9.8"
# Named rather than taken from ureq's defaults, because `s3::transient`
# matches `Error::Rustls`, which only exists while this feature is on.
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
# serde: the archive endpoint deserializes as a `Url`, so a bad one is a
# config error naming the field.
url = { version = "2.5.8", features = ["serde"] }
base64 = "0.22.1"
ciborium = "0.2"
blake2 = "0.10.6"
ed25519-dalek = "3.0.0"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
zstd = "0.13.3"
