[package]
name = "metsuke-server"
description = "Ingest server verifying and storing signed telemetry submissions"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
toml = "0.9.8"

[dependencies]
metsuke-wire = { path = "../metsuke-wire" }
bytes = "1.11.0"
# The HTTP surface. http1 and server only: the endpoint speaks HTTP/1.1 behind
# a proxy, and a protocol nothing sends is a protocol nothing has to be safe
# against.
hyper = { version = "1.11.0", default-features = false, features = [
  "http1",
  "server",
] }
# `TokioIo` and `TokioTimer`, which is all hyper needs to run on tokio.
hyper-util = { version = "0.1.20", default-features = false, features = [
  "tokio",
] }
http-body-util = "0.1.5"
# Request signing and listing only; the transport is ureq.
rusty-s3 = { version = "0.10.2", default-features = false, features = [
  "rustcrypto",
  "xml",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
# `rt` and not `rt-multi-thread`: the runtime shape is `serve::bind`'s.
tokio = { version = "1.53.1", default-features = false, features = [
  "net",
  "rt",
  "sync",
  "time",
] }
toml = "0.9.8"
# Named rather than taken from ureq's defaults, because `s3::transient`
# matches `Error::Rustls`, which only exists while this feature is on.
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
# serde: the archive endpoint deserializes as a `Url`, so a bad one is a
# config error naming the field.
url = { version = "2.5.8", features = ["serde"] }
base64 = "0.22.1"
blake2 = "0.10.6"
ed25519-dalek = "3.0.0"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
# The S3 endpoint doubles the archive suite runs against. Only a test serves
# over it; the server's own surface is hyper.
tiny_http = { version = "0.12.0", default-features = false }
uuid = { version = "1.25.0", features = ["v7"] }
zstd = "0.13.3"
