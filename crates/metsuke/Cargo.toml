[package]
name = "metsuke"
description = "Telemetry agent sampling cardano-node metrics and uploading signed batches"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gethostname = "1"
metsuke-wire = { path = "../metsuke-wire" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
toml = "0.9.8"
# Without a provider ureq answers TlsRequired, which the uploader can only
# read as a retryable failure.
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
