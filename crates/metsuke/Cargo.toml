[package]
name = "metsuke"
description = "Telemetry agent sampling cardano-node metrics and uploading signed batches"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bech32 = "0.12.0"
blake2 = "0.10.6"
ed25519-dalek = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
ureq = { version = "3.4.0", default-features = false }
zstd = "0.13.3"

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
