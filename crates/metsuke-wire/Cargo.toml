[package]
name = "metsuke-wire"
description = "Wire contract and small helpers shared by the metsuke agent and server"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bech32 = "0.12.0"
blake2 = "0.10.6"
ed25519-dalek = "3.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = [
  "float_roundtrip",
  "raw_value",
] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
# No TLS from here: what a binary's transport needs is its own choice, and
# feature unification would otherwise hand the agent the server's.
ureq = { version = "3.4.0", default-features = false }
zstd = "0.13.3"

[dev-dependencies]
proptest = "1.11.0"
