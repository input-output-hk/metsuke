[package]
name = "metsuke-wire"
description = "Wire contract and small helpers shared by the metsuke agent and server"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bech32 = "0.12.0"
blake2 = "0.10.6"
# The Leios key's signatures (ADR 0011), and the same C library
# cardano-crypto-class binds, so both ends compute over the same code.
# `portable` because the default detects the *builder's* CPU and bakes the
# result in: a substituted binary would then depend on the machine that built
# it. `no-threads` because nothing here verifies more than one signature.
blst = { version = "0.3.17", default-features = false, features = [
  "no-threads",
  "portable",
] }
ed25519-dalek = "3.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = [
  "float_roundtrip",
  "raw_value",
] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
# No TLS from here: what a binary's transport needs is its own choice, and
# feature unification would otherwise hand the agent the server's.
ureq = { version = "3.4.0", default-features = false }
# The object key's unique segment (`key::ObjectName`). Default features rather
# than v7 alone: the random half is what `rng` brings.
uuid = { version = "1.25.0", features = ["v7"] }
zstd = "0.13.3"

[features]
# `fixtures`: test-only Scrape values every crate's suite shares. Only a
# dev-dependency names it, and resolver 2 keeps dev-dependency features out of
# a normal build, so no shipped binary carries the module.
fixtures = []

[dev-dependencies]
# The consensus ciphersuite, to sign in it: the one test that shows a
# submission signature and a vote signature cannot be each other (tests/leios.rs).
blst = { version = "0.3.17", default-features = false, features = [
  "no-threads",
  "portable",
] }
# This crate's own tests, on itself, for `fixtures`: a crate cannot enable one
# of its features for its own test targets any other way.
metsuke-wire = { path = ".", features = ["fixtures"] }
proptest = "1.11.0"
